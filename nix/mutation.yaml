# Mutation-plugin config used by every in-repo mutation check
# (mutation-opt-env-conf, mutation-safe-coloured-text,
# mutation-sydtest-mutation-example).
#
# Schema: Test.Syd.Mutation.Plugin.OptParse.MutationPluginConfig.
# Passed to the plugin via '--config=PATH' by sydtest.mutationCheck.

debug: true

# Exercises the 'ignore' filter from sydtest-mutation-example's
# Example.IgnoreLib: 'mark' is a no-op marker, and calls to it must be
# left untouched even when wrapped by '$' (which expands to a typecheck
# 'ExpandedThingTc' node).
#
# Exercises the three forms of name matching in the ignore filter:
#   * 'mark' bare (matches any module),
#   * 'markM' fully qualified by its (local) defining module,
#   * 'censor' fully qualified by the module it is imported through
#     (Control.Monad.Writer), which differs from where it is defined
#     (Control.Monad.Writer.Class).
ignore:
  - mark
  - Example.IgnoreLib.markM
  - Control.Monad.Writer.censor

# Exercises 'SwitchFunctionArguments' suppression: 'majorityOf5' (in
# Example.ConstFnLib) is symmetric in its arguments, so swapping any two
# produces an equivalent, unkillable mutant.  Listing it here skips the swap
# at every call to it.  Given fully qualified (by its defining module) to
# exercise fully-qualified name matching in skip-calls-to.
operators:
  SwitchFunctionArguments:
    skip-calls-to:
      - Example.ConstFnLib.majorityOf5
  # Exercises 'ElideCall' suppression: 'same' (in Example.ElideCallLib) is a
  # user-defined identity, so eliding a call to it produces an equivalent,
  # unkillable mutant.  Listing it here skips the elision at every call to it.
  # ('id' is skipped by default and needs no entry.)
  ElideCall:
    skip-calls-to:
      - same
  # Exercises 'ConstConstructor' suppression: 'constantDirection' (in
  # Example.ConstConstructorLib) answers with the same constructor whatever it
  # is given, so replacing a call to it with a constant produces an
  # equivalent, unkillable mutant.  Listing it here skips the operator at
  # every call to it.
  ConstConstructor:
    skip-calls-to:
      - constantDirection
  # Exercises 'ListLit' suppression: 'report' (in Example.ListLitCallsLib)
  # stands in for a log or an error function, whose argument is a message
  # nobody asserts the wording of. Listing it here skips the operator on a list
  # literal anywhere inside its argument, which is what makes the option useful:
  # the call a list literal is the immediate argument of is always 'mconcat' or
  # 'unwords', never the function that says what the message is for.
  ListLit:
    skip-calls-to:
      - report
  # 'ConstEmptyList' reaches the same lists from the other side, by their type
  # rather than their syntax, so it takes the same entry. Sharing 'report' with
  # 'ListLit' above is what leaves Example.ListLitCallsLib with no ANN pragma
  # at all: both operators are answered by this config, which is the point of
  # the key, since a list inside an instance method has no binding to annotate.
  ConstEmptyList:
    skip-calls-to:
      - report
