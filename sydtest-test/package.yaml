name: sydtest-test
version: 0.0.0.0
github: "NorfairKing/sydtest"
license: OtherLicense
author: "Tom Sydney Kerckhove"
maintainer: "syd@cs-syd.eu"
category: Testing

extra-source-files:
- test_resources/**/*

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src

executables:
  # A real test suite for the Ctrl-C test to interrupt.
  sydtest-ctrl-c-suite:
    main: Main.hs
    source-dirs: ctrl-c-suite
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - sydtest

tests:
  sydtest-test:
    main: Spec.hs
    source-dirs: test
    build-tools:
    - sydtest-discover
    - sydtest-test:sydtest-ctrl-c-suite
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - QuickCheck
    - async
    - bytestring
    - containers
    - directory
    - fast-myers-diff
    - mtl
    - opt-env-conf-test
    - path
    - path-io
    - process
    - random
    - safe-coloured-text
    - stm
    - sydtest >=0.17
    - sydtest-mutation-runtime
    - text
    - time
    - vector

  sydtest-output-test:
    main: Main.hs
    source-dirs: output-test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - QuickCheck
    - bytestring
    - stm
    - sydtest
    - text

  sydtest-multi-discover-test:
    main: Main.hs
    source-dirs: multi-discover-test
    build-tools: sydtest-discover
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - sydtest
